plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 的运行时是 Java 17。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Mixin：1.20.1 线上运行时是 SRG 名，必须生成 refmap，否则注入在生产环境失效。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 本地预置的依赖（libs/maven）。存在时优先命中，不存在时自动回落到下面的远程仓库，
    // 这样在慢速网络下可以先手工 curl 一份 jar 进来，无需改动下面的依赖坐标。
    maven { url = uri("$projectDir/libs/maven") }
    maven { url = "https://maven.aliyun.com/repository/public" }
    // 机械动力及其 Catnip / Ponder / Flywheel
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // Registrate 在 ithundxr 的 mirror 仓库里
    maven { url = "https://maven.ithundxr.dev/mirror" }
    // 可选前置 Curios API
    maven { url = "https://maven.theillusivec4.top/" }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 机械动力 6.0.8（1.20.1）。-slim 不含打包的依赖库，故显式补 Ponder / Flywheel / Registrate。
    // 注意 Ponder 的 jar 里同时打包了 Catnip，因此不需要单独的 Catnip 依赖。
    // 这些前置同时是 development 运行所需的模组（ForgeGradle 会把 implementation 的 jar 放进
    // runClient/runServer 的 classpath，FML 在开发环境从 classpath 发现模组），所以用 implementation
    // 而不是 compileOnly——否则 run/mods 为空时启动会报 Missing or unsupported mandatory dependencies。
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    // Curios 是可选的编译期依赖；未安装时相关代码不会执行。
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 只在 mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    // mods.toml 里含中文，必须显式用 UTF-8 读写；Gradle 的过滤默认取平台编码（本机 GBK）会把中文写坏。
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}
