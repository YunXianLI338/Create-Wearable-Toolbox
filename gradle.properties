org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.248

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1,1.22)
neo_version_range=[21.1,)

# Parchment 社区映射（补方法名/参数名）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata（mod_id 必须与 @Mod 注解、neoforge.mods.toml 一致）
mod_id=wearable_toolbox
# gradle.properties 按 ISO-8859-1 读取，中文必须写成 Unicode 转义，否则会变成乱码。
# 下面两行对应的可读文本：
#   mod_name        = 可穿戴的工具箱
#   mod_description = 可穿戴的工具箱（Wearable Toolbox）——把工具箱穿在身上，随时取用。
mod_name=\u53ef\u7a7f\u6234\u7684\u5de5\u5177\u7bb1
mod_version=0.1.0
mod_group_id=com.minecart.wearabletoolbox
mod_authors=YunXian_LI
mod_license=MIT
mod_description=\u53ef\u7a7f\u6234\u7684\u5de5\u5177\u7bb1\uff08Wearable Toolbox\uff09\u2014\u2014\u628a\u5de5\u5177\u7bb1\u7a7f\u5728\u8eab\u4e0a\uff0c\u968f\u65f6\u53d6\u7528\u3002

# 前置模组版本
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
curios_version=9.2.2
