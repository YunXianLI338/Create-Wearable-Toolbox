org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge. Both values must target the same Minecraft version.
minecraft_version=1.21.1
neo_version=21.1.248

# Version ranges used by dependencies in neoforge.mods.toml.
minecraft_version_range=[1.21.1,1.22)
neo_version_range=[21.1,)

# Parchment community mappings.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata. mod_id must stay in sync with @Mod and neoforge.mods.toml.
mod_id=wearable_toolbox
mod_name=Create: Wearable Toolbox
mod_version=0.1.2
mod_group_id=com.minecart.wearabletoolbox
mod_authors=YunXian_LI
mod_license=MIT
mod_description=

# Dependency versions.
create_version=6.0.10-280
curios_version=9.5.1
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
