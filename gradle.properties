org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Forge (1.20.1 line). Both values must target the same Minecraft version.
minecraft_version=1.20.1
forge_version=47.3.0

# 依赖声明用的版本范围（mods.toml 里展开）。
minecraft_version_range=[1.20.1,1.21)
forge_version_range=[47,)

# 映射：official（Mojang）+ ForgeGradle 直接可用，不额外挂 Parchment。
mapping_channel=official
mapping_version=1.20.1

# Mod metadata. mod_id must stay in sync with @Mod and META-INF/mods.toml.
mod_id=wearable_toolbox
mod_name=Create: Wearable Toolbox
mod_version=0.1.3
mod_group_id=com.minecart.wearabletoolbox
mod_authors=YunXian_LI
mod_license=MIT
mod_description=

# Dependency versions (1.20.1). These mirror the versions Create 6.0.8 itself is built against.
create_version=6.0.8-291
ponder_version=1.0.91
flywheel_version=1.0.6-beta-266
registrate_version=MC1.20-1.3.3
mixinextras_version=0.4.1
curios_version=5.14.1+1.20.1
